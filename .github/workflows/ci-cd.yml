name: CI/CD Production

on:
  push:
    branches:
      - production

jobs:

  backend:
    name: Build & Push Backend
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Login Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build Backend
        run: |
          docker build \
            -t ${{ secrets.DOCKERHUB_USERNAME }}/storyvn-backend:latest \
            ./backend

      - name: Push Backend
        run: |
          docker push \
            ${{ secrets.DOCKERHUB_USERNAME }}/storyvn-backend:latest


  frontend:
    name: Build & Push Frontend
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Login Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build Frontend
        run: |
          docker build \
            --build-arg NEXT_PUBLIC_API_URL=/api \
            -t ${{ secrets.DOCKERHUB_USERNAME }}/storyvn-frontend:latest \
            ./frontend

      - name: Push Frontend
        run: |
          docker push \
            ${{ secrets.DOCKERHUB_USERNAME }}/storyvn-frontend:latest


  deploy:
    name: Deploy to Azure VPS
    runs-on: ubuntu-latest
    needs: [backend, frontend]

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            cd ~/StoryVN
            docker compose pull
            docker compose up -d
            docker image prune -f