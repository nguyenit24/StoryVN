name: CI/CD Production

on:
  push:
    branches:
      - production

jobs:

  backend:
    name: Build & Push Backend
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Login Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build Backend
        run: |
          docker build \
            -t ${{ secrets.DOCKERHUB_USERNAME }}/storyvn-backend:latest \
            ./backend

      - name: Push Backend
        run: |
          docker push \
            ${{ secrets.DOCKERHUB_USERNAME }}/storyvn-backend:latest


  frontend:
    name: Build & Push Frontend
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Login Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build Frontend
        run: |
          docker build \
            -t ${{ secrets.DOCKERHUB_USERNAME }}/storyvn-frontend:latest \
            ./frontend

      - name: Push Frontend
        run: |
          docker push \
            ${{ secrets.DOCKERHUB_USERNAME }}/storyvn-frontend:latest